<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Checker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Password Strength Checker</h1>
        <p>Enter your password to check its strength</p>

        <input type="password" id="password" placeholder="Enter password">

        <div class="strength-bar">
            <div id="strength"></div>
        </div>

        <h3 id="strengthText">Password Strength: </h3>

        <div class="requirements">
            <p id="length">❌ At least 8 characters</p>
            <p id="uppercase">❌ Contains uppercase letter</p>
            <p id="lowercase">❌ Contains lowercase letter</p>
            <p id="number">❌ Contains a number</p>
            <p id="special">❌ Contains special character</p>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
